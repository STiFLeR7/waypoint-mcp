name: ci

on:
  push:
  pull_request:
  workflow_call:  # release.yml runs every job here before it publishes

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error -m unittest -v
      - name: Installed wheel, run from outside the checkout
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
          python -m pip install "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP" && python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python examples/build.py --check  # fixture sessions + frozen clock: byte-identical

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python scripts/release_check.py dist  # wheel + sdist: allowed files only, no owner strings
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
      - name: Installed sdist, run from outside the checkout
        run: |
          python -m build --sdist --outdir "$RUNNER_TEMP/sdist"
          python -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/sdist/*.tar.gz
          cd "$RUNNER_TEMP" && PATH="$RUNNER_TEMP/venv/bin:$PATH" python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"

  beacon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beacon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  no-personal-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the public view of the tree: no secret or local-config files, no logbook data, no owner strings
      - run: python3 scripts/release_check.py tree
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
