function sessionsPanel(p){const intro=el('p',{class:'tab-explanation'},`Session titles from the recent activity feed: ${p.pulseDays?`the last ${p.pulseDays} days, `:''}up to a fixed number of entries, untitled sessions left out. Older or untitled sessions may exist.`);if(!p.sessions.length)return el('div',{},intro,el('div',{class:'empty'},el('h2',{},'No session titles in the recent feed'),el('p',{},'The project log may still have context.')));return el('div',{},intro,el('ul',{class:'session-list'},...p.sessions.map(([source,title,ts])=>el('li',{class:'session'},el('p',{class:'session-title'},el('span',{class:'tool'},source),title),el('time',{},ts==null?'Time unavailable':new Date(ts*1000).toLocaleString())))))}
function logsPanel(p){return p.logs.length?el('ol',{class:'log-list'},...p.logs.map(entry=>el('li',{class:'log-entry'},el('header',{},entry.date||'Date unavailable',entry.tool?` · ${entry.tool}`:''),el('p',{},entry.text)))):el('div',{class:'empty'},el('h2',{},'No project log yet'),el('p',{},'This record has no log entries.'))}
function renderDetail(){const p=selected;const back=el('button',{type:'button',class:'back',title:'Esc'},icon('back'),'Back to projects');back.addEventListener('click',()=>closeProject());const tabs=el('div',{class:'detail-tabs',role:'tablist','aria-label':'Project information'});const titles=[['overview','Overview'],['files','Docs'],['sessions','Sessions'],['logs','Project log']];
 for(const[id,title]of titles){const b=el('button',{type:'button',class:'detail-tab',id:'tab-'+id,role:'tab','aria-selected':detailTab===id,'aria-controls':'project-panel',tabindex:detailTab===id?0:-1},title);b.addEventListener('click',()=>{detailTab=id;renderDetail();$('#tab-'+id).focus()});b.addEventListener('keydown',e=>{const i=titles.findIndex(t=>t[0]===id);const next=e.key==='ArrowRight'?(i+1)%4:e.key==='ArrowLeft'?(i+3)%4:e.key==='Home'?0:e.key==='End'?3:null;if(next==null)return;e.preventDefault();detailTab=titles[next][0];renderDetail();$('#tab-'+detailTab).focus()});tabs.append(b)}
 const panel=el('div',{id:'project-panel',role:'tabpanel','aria-labelledby':'tab-'+detailTab},detailTab==='overview'?overviewPanel(p):detailTab==='files'?filesPanel(p):detailTab==='sessions'?sessionsPanel(p):logsPanel(p));
 $('#detail').replaceChildren(back,el('div',{class:'detail-heading'},el('h1',{id:'detail-title',tabindex:'-1'},p.name),el('p',{class:p.summary?null:'unknown'},p.summary||'Purpose not recorded yet.')),el('div',{class:'detail-meta'},statusEl(p),...signalSummary(p),lastActivity(p),tool(p)),tabs,panel)}
$('#search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();renderCatalog()});$('#search').addEventListener('keydown',e=>{if(e.key==='Escape'){query='';e.target.value='';renderCatalog()}});$('#sort').addEventListener('change',e=>{sort=e.target.value;renderCatalog()});$('#mobile-collection').addEventListener('change',e=>changeCollection(e.target.value));$('#grid-view').addEventListener('click',()=>{view='grid';renderCatalog()});$('#list-view').addEventListener('click',()=>{view='list';renderCatalog()});$('#reset').addEventListener('click',reset);$('#empty-reset').addEventListener('click',reset);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(selected)closeProject();$('#search').focus();$('#search').select()}else if(e.key==='Escape'&&selected)closeProject()});if(/Mac|iPhone|iPad/.test(navigator.platform))$('#shortcut').textContent='⌘ K';
$('#choose-data').addEventListener('click',()=>$('#data-file').click());
async function loadFile(file){if(!file)return;if(file.size>10485760){rejected(`${file.name} not loaded`,'The file is larger than 10 MiB.');return}let raw;try{raw=JSON.parse(await file.text())}catch(e){rejected(`${file.name} not loaded`,`Invalid JSON: ${e.message}.`);return}acceptDashboard(raw,file.name)}
$('#data-file').addEventListener('change',e=>{loadFile(e.target.files[0]);e.target.value=''});
$('#overview').addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files'))e.preventDefault()});$('#overview').addEventListener('drop',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();loadFile(e.dataTransfer.files[0])}});
hydrateIcons();renderNav();renderSignals();renderCatalog();
(()=>{let raw;try{raw=JSON.parse($('#waypoint-data').textContent)}catch(e){rejected('Embedded data not loaded',`Invalid JSON: ${e.message}.`);return}if(raw===null){$('#choose-data').textContent='Open a dashboard.json file';setSource('No data','unknown','This page has no embedded dashboard.');return}acceptDashboard(raw,null)})();
</script>
