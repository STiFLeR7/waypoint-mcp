[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "waypoint-mcp"
version = "0.3.0"
description = "Every voyage, every navigator, one chart: track your projects across Claude Code, Codex, Gemini CLI, Copilot CLI and ChatGPT."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["mcp", "model-context-protocol", "claude-code", "codex", "ai-agents", "project-tracking", "logbook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.optional-dependencies]
tui = ["rich>=13", "prompt_toolkit>=3"]  # the arrow-key screen; the engine and MCP server stay dependency-free

[project.urls]
Homepage = "https://github.com/STiFLeR7/waypoint-mcp"
Issues = "https://github.com/STiFLeR7/waypoint-mcp/issues"
Changelog = "https://github.com/STiFLeR7/waypoint-mcp/blob/main/CHANGELOG.md"

[project.scripts]
waypoint = "waypoint.cli:main"
waypoint-mcp = "waypoint.mcp:main"

[tool.setuptools]
packages = ["waypoint", "waypoint.sources", "waypoint.tui"]

[tool.setuptools.package-data]
waypoint = ["templates/*.md", "templates/*.html", "templates/logbook/*"]
